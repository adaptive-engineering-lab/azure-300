# Netlify deploy configuration for the AI-300 study frontend.
# The repo is a multi-package monorepo (frontend/, tools/, supabase/);
# only frontend/ is deployed. Tools and Supabase are maintainer-side.

[build]
  base    = "frontend"
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm build"
  # `publish` is resolved relative to `base`, so this becomes frontend/dist.
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # pnpm is enabled via corepack; pin the version that lockfile expects.
  PNPM_VERSION = "10"

# SPA fallback: every non-asset route must serve index.html so React
# Router can take over on the client. Without this, /admin or
# /learn/flashcards would 404 on direct visit / hard reload.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Reasonable cache headers. Hashed JS/CSS assets can be cached forever;
# index.html should never be cached so the service-worker update
# can find a new manifest.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
