name: data-layer

on:
  pull_request:
    paths:
      # T045: spec-only PRs are excluded — paths-ignore wins over paths
      # only when no listed path matches, so we list what *should* trigger.
      - supabase/**
      - tools/**
      - tests/**
      - .github/workflows/data-layer.yml
  push:
    branches: [main]
    paths:
      - supabase/**
      - tools/**
      - tests/**
      - .github/workflows/data-layer.yml

jobs:
  schema-and-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: pnpm install
        working-directory: tools
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        # `supabase start` boots Postgres + Auth + Studio + etc. and applies
        # every migration under supabase/migrations/ automatically.
        run: supabase start

      - name: Export local Supabase keys
        run: |
          status=$(supabase status --output env)
          # status is in `KEY="value"` form; eval it into the workflow env.
          eval "$status"
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Validate seed content
        working-directory: tools
        run: pnpm seed:validate

      - name: Seed
        working-directory: tools
        run: pnpm seed

      - name: Tests
        working-directory: tools
        run: pnpm test

      - name: Stop Supabase stack
        if: always()
        run: supabase stop --no-backup
